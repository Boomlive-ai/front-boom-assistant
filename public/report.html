<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BOOM Monthly Report</title>

    <!-- Relative on purpose, like index.html — see README "Two addresses".
         No trailing-slash guard is needed here: report.html is a file name,
         so relative links already resolve inside the right folder. -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="report.css" />
    <!-- Filled in by report.js with the month, for the printed page footer. -->
    <style id="print-footer"></style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-text">BOOM</span>
      </div>
      <nav class="topbar-nav">
        <!-- "./" is this app's own front page, at either address. -->
        <a href="./" class="nav-btn">← Boom AI Assistant</a>
        <!-- Absolute on purpose, same as on index.html. -->
        <a href="https://toolbox.boomlive.in/">Home</a>
      </nav>
    </header>

    <!-- rp-page is wider than the other page, to fit the topics sidebar
         beside the report; the form card stays at the usual width. -->
    <main class="page rp-page">
      <section class="card no-print rp-form-card">
        <h1 class="page-title">Monthly Report</h1>

        <form id="report-form" class="seo-form" novalidate>
          <div class="two-col">
            <fieldset class="field">
              <legend>Month</legend>
              <!-- Filled by report.js from api/report/months: one option per
                   month saved in the database, plus "Another month". -->
              <div class="rp-select-wrap">
                <select name="month" id="month-select" aria-describedby="month-status" disabled>
                  <option value="">Loading months…</option>
                </select>
              </div>

              <!-- Only for "Another month": a month the database does not have. -->
              <div id="other-month-row" class="rp-other-month" hidden>
                <label for="other-month">Which month?</label>
                <!-- The pattern and placeholder only matter in browsers that
                     show this as a plain text box (older Firefox, Safari). -->
                <input
                  type="month"
                  id="other-month"
                  name="other_month"
                  pattern="\d{4}-\d{2}"
                  placeholder="YYYY-MM"
                />
              </div>

              <p id="month-status" class="rp-field-note" aria-live="polite"></p>
            </fieldset>

            <fieldset class="field">
              <legend>Text</legend>
              <label class="check-row">
                <input type="checkbox" name="narrative" />
                Write the text with AI <span class="hint">(slower)</span>
              </label>
            </fieldset>
          </div>

          <!-- Switched on only when the month is not in the database. -->
          <fieldset id="sheet-field" class="field" disabled>
            <legend>Fact-check sheet <span class="hint">(.xlsx)</span></legend>
            <input
              type="file"
              name="file"
              aria-describedby="sheet-status"
              accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"
            />
            <p id="sheet-status" class="rp-field-note">Choose a month first.</p>
          </fieldset>

          <div class="actions">
            <button type="submit" id="report-btn" class="btn primary">
              <span class="btn-label">Generate Report</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
            <button type="reset" class="btn ghost">Reset</button>
          </div>
        </form>

        <div id="report-error" class="rp-error" hidden></div>
      </section>

      <!-- Two columns once a report is drawn: the topics sidebar, then the
           report. report.js adds the has-sidebar class. -->
      <div id="report-layout" class="rp-layout">
        <!-- Filled by showTopicSidebar() in report-common.js: one link per
             topic of the month, each opening topic.html in a new tab. -->
        <aside id="topic-nav" class="rp-sidebar no-print" aria-label="Topics" hidden></aside>

        <div class="rp-main">
          <!-- Shown once a report is on the page. -->
          <div id="report-tools" class="rp-tools no-print" hidden>
            <div id="month-switch" class="rp-month-switch"></div>
            <div class="rp-tools-actions">
              <button type="button" id="copy-json" class="btn ghost small">Copy JSON</button>
              <button type="button" id="print-btn" class="btn primary small">Print / Save as PDF</button>
            </div>
          </div>

          <!-- Drawn by renderReport() in report.js from the api/report reply. -->
          <article id="report" class="card report" hidden></article>
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <!-- Absolute like the Home link above. -->
    <footer class="sitefoot">
      <nav class="sitefoot-links">
        <a href="https://toolbox.boomlive.in/privacy.php">Privacy Policy</a>
        <a href="https://toolbox.boomlive.in/data-deletion.php">Data Deletion</a>
      </nav>
    </footer>

    <!-- Shared helpers first: report.js calls them. -->
    <script src="report-common.js"></script>
    <script src="report.js"></script>
  </body>
</html>
